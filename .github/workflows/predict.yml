name: LeishScan AI Inference

on:
  push:
    paths:
      - '.github/workflows/predict.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:
    inputs:
      lesion_url:
        description: 'Lesion image URL'
        required: true
      microscopy_urls:
        description: 'JSON list of 1-5 microscopy image URLs'
        required: true
      request_id:
        description: 'Unique Request ID'
        required: true

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout ONNX models & code only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            inference.py
            requirements.txt
            onnx_models

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Warm-up ping (push or scheduled keep-alive)
        if: github.event_name != 'workflow_dispatch'
        run: python -c "import onnxruntime, numpy, PIL; print('ONNX cache warmed and active!')"

      - name: Run Prediction & Post Result
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LESION_URL: ${{ github.event.inputs.lesion_url }}
          MICROSCOPY_URLS: ${{ github.event.inputs.microscopy_urls }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from inference import predict

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 LeishScan"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          micro_urls = json.loads(os.environ["MICROSCOPY_URLS"])[:5]
          with ThreadPoolExecutor(max_workers=6) as ex:
              lesion_f = ex.submit(fetch, os.environ["LESION_URL"])
              micro_fs = [ex.submit(fetch, u) for u in micro_urls]
              lesion = lesion_f.result()
              micros = [f.result() for f in micro_fs]

          res = predict(lesion, micros)
          with open("out.json", "w") as out:
              json.dump(res, out)
          PY
          gh issue create --title "RESULT-${REQUEST_ID}" --body-file out.json
