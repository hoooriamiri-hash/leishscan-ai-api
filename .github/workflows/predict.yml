name: LeishScan AI Inference

on:
  workflow_dispatch:
    inputs:
      lesion_url:
        description: 'Lesion image URL or base64'
        required: true
      microscopy_url:
        description: 'Microscopy image URL or base64'
        required: true
      request_id:
        description: 'Unique Request ID'
        required: true

jobs:
  run-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Prediction
        run: |
          python -c "
          import urllib.request, json, os
          from inference import predict
          urllib.request.urlretrieve('${{ github.event.inputs.lesion_url }}', 'lesion.jpg')
          urllib.request.urlretrieve('${{ github.event.inputs.microscopy_url }}', 'micro.jpg')
          with open('lesion.jpg', 'rb') as f1, open('micro.jpg', 'rb') as f2:
              res = predict(f1.read(), f2.read())
          with open('result_${{ github.event.inputs.request_id }}.json', 'w') as out:
              json.dump(res, out)
          "

      - name: Upload Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ github.event.inputs.request_id }}
          path: result_${{ github.event.inputs.request_id }}.json
