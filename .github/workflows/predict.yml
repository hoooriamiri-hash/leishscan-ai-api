name: LeishScan AI Inference

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:
    inputs:
      lesion_url:
        description: 'Lesion image URL'
        required: true
      microscopy_url:
        description: 'Microscopy image URL'
        required: true
      request_id:
        description: 'Unique Request ID'
        required: true

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pre-built virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-py310-${{ hashFiles('requirements.txt') }}

      - name: Build virtual environment (only on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir -r requirements.txt

      - name: Warm-up ping (scheduled keep-alive)
        if: github.event_name == 'schedule'
        run: .venv/bin/python -c "import torch, ultralytics; print('Cache kept alive!')"

      - name: Run Prediction & Post Result
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .venv/bin/python -c "
          import urllib.request, json
          from concurrent.futures import ThreadPoolExecutor
          from inference import predict

          with ThreadPoolExecutor(max_workers=2) as ex:
              f1 = ex.submit(urllib.request.urlretrieve, '${{ github.event.inputs.lesion_url }}', 'lesion.jpg')
              f2 = ex.submit(urllib.request.urlretrieve, '${{ github.event.inputs.microscopy_url }}', 'micro.jpg')
              f1.result(); f2.result()

          with open('lesion.jpg', 'rb') as img1, open('micro.jpg', 'rb') as img2:
              res = predict(img1.read(), img2.read())
          with open('out.json', 'w') as out:
              json.dump(res, out)
          "
          gh issue create --title "RESULT-${{ github.event.inputs.request_id }}" --body-file out.json
