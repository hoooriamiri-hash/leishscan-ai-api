name: LeishScan AI Inference

on:
  workflow_dispatch:
    inputs:
      lesion_url:
        description: 'Lesion image URL'
        required: true
      microscopy_url:
        description: 'Microscopy image URL'
        required: true
      request_id:
        description: 'Unique Request ID'
        required: true

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Prediction & Post Result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import urllib.request, json
          from inference import predict
          urllib.request.urlretrieve('${{ github.event.inputs.lesion_url }}', 'lesion.jpg')
          urllib.request.urlretrieve('${{ github.event.inputs.microscopy_url }}', 'micro.jpg')
          with open('lesion.jpg', 'rb') as f1, open('micro.jpg', 'rb') as f2:
              res = predict(f1.read(), f2.read())
          with open('out.json', 'w') as out:
              json.dump(res, out)
          "
          gh issue create --title "RESULT-${{ github.event.inputs.request_id }}" --body-file out.json
