name: LeishScan AI Inference

on:
  push:
    paths:
      - '.github/workflows/predict.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:
    inputs:
      lesion_url:
        description: 'Lesion image URL'
        required: true
      microscopy_urls:
        description: 'JSON list of 1-5 microscopy image URLs'
        required: true
      request_id:
        description: 'Unique Request ID'
        required: true

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout ONNX models & code only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            inference.py
            requirements.txt
            onnx_models

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Warm-up ping (push or scheduled keep-alive)
        if: github.event_name != 'workflow_dispatch'
        run: python -c "import onnxruntime, numpy, PIL; print('ONNX cache warmed and active!')"

      - name: Run Prediction & Post Result
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LESION_URL: ${{ github.event.inputs.lesion_url }}
          MICROSCOPY_URLS: ${{ github.event.inputs.microscopy_urls }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          from inference import predict

          def fetch(url, path):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 LeishScan"})
              with urllib.request.urlopen(req, timeout=60) as r, open(path, "wb") as f:
                  f.write(r.read())
              return path

          micro_urls = json.loads(os.environ["MICROSCOPY_URLS"])[:5]
          lesion_path = "lesion.jpg"
          micro_paths = [f"micro_{i}.jpg" for i in range(len(micro_urls))]

          # download lesion + every microscopy slide into its own file, in parallel
          with ThreadPoolExecutor(max_workers=6) as ex:
              futs = [ex.submit(fetch, os.environ["LESION_URL"], lesion_path)]
              futs += [ex.submit(fetch, u, p) for u, p in zip(micro_urls, micro_paths)]
              for f in futs:
                  f.result()

          for p in [lesion_path] + micro_paths:
              im = Image.open(p)
              print(f"{p}: {im.size[0]}x{im.size[1]} {os.path.getsize(p)//1024} KB", flush=True)

          res = predict(lesion_path, micro_paths)
          with open("out.json", "w") as out:
              json.dump(res, out)
          PY
          gh issue create --title "RESULT-${REQUEST_ID}" --body-file out.json
