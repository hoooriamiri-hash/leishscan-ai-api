name: Export Models to ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-onnx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU PyTorch & ONNX dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://pytorch.org
          pip install -r requirements.txt
          pip install onnx onnxruntime onnxslim onnxscript ultralytics

      - name: Run export_onnx.py
        run: |
          python export_onnx.py
          ls -lh onnx_models/

      - name: Commit and push ONNX models
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add onnx_models/*.onnx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Export DenseNet121 and YOLOv8n models to ONNX" && git push)
