name: Export PyTorch Models to ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-onnx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision ultralytics onnx onnxslim

      - name: Run ONNX export script
        run: |
          python export_onnx.py

      - name: Commit and push ONNX models
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add onnx_models/
          git diff --staged --quiet || git commit -m "chore: export 6 models to ONNX for browser inference"
          git push
